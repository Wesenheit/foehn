[workspace]
name = "foehn"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
openmpi = ">=5.0"
libpmix = ">=5.0"
pkg-config = "*"
pytest = "*"
meson-python = "*"
meson = "*"
ninja = "*"
pip = "*"
pytorch-cpu = "*"

[pypi-dependencies]
foehn = { path = ".", editable = true }

[tasks]
build = "pip install --no-build-isolation -e ."
test = "pytest tests -v"
ci = { depends-on = ["build", "test"] }
