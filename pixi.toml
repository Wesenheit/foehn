[workspace]
name = "rixa"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]


[package]
name = "rixa"
version = "0.0.1"

[dependencies]
python = ">=3.10"
openmpi = ">=5.0"
libpmix-devel = ">=5.0"
setuptools = "*"
pytest = "*"
pip = "*"
pytorch-cpu = "*"
patchelf = ">=0.17.2,<0.19"

[target.linux-64.dependencies]
nvshmem4py = "*"

[pypi-dependencies]
rixa = { path = ".", editable = true }
build = ">=1.5.0, <2"
twine = ">=6.2.0, <7"
auditwheel = ">=6.6.0, <7"

[package.build]
backend = { name = "pixi-build-python", version = "*" }


[package.build.config]
noarch = false
abi3 = true
compilers = ["c",]

[package.host-dependencies] 
libpmix-devel = ">=5.0"
setuptools = "*"

[tasks]
build = "pip install --no-build-isolation -e ."
test = "pytest tests -v"
ci = { depends-on = ["build", "test"] }

#publishing and building
wheel = "python -m build --wheel"
sdist = "python -m build --sdist"
audit = "auditwheel repair dist/*.whl -w wheelhouse/"
check-wheel = "twine check wheelhouse/* dist/*"
pre-publish = { depends-on = ["wheel","sdist", "audit","check-wheel"]}
clean = "rm -rf dist/ wheelhouse/ build/"
publish-test = "twine upload --repository testpypi wheelhouse/*"
