[workspace]
name = "foehn"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]


[package]
name = "foehn"
version = "0.1.0"

[dependencies]
python = ">=3.11"
openmpi = ">=5.0"
libpmix-devel = ">=5.0"
setuptools = "*"
pkg-config = "*"
pytest = "*"
mpi4py = "*"
scikit-build-core = "*"
cmake = "*"
ninja = "*"
pip = "*"
pytorch-cpu = "*"

[pypi-dependencies]
foehn = { path = ".", editable = true }

[package.build]
backend = { name = "pixi-build-python", version = "*" }


[package.build.config]
noarch = false
abi3 = true
compilers = ["c",]

[package.host-dependencies] 
libpmix-devel = ">=5.0"
setuptools = "*"

[tasks]
build = "pip install --no-build-isolation -e ."
test = "pytest tests -v"
ci = { depends-on = ["build", "test"] }
